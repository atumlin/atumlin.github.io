---
layout: default
---

<div class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
      <p class="post-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <article>
    <p>
      <a href="{{ page.cv_pdf | relative_url }}" target="_blank" rel="noopener noreferrer">Download my CV as a PDF</a>.
    </p>

    <iframe
      src="{{ page.cv_pdf | relative_url }}"
      width="100%"
      height="1000px"
      style="border: none;">
      Your browser does not support embedded PDFs.
      <a href="{{ page.cv_pdf | relative_url }}">Download the PDF</a> instead.
    </iframe>
  </article>
</div>
